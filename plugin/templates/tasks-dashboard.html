ngth);e++){let t=(n[e]??0)-(r[e]??0);if(t!==0)return t}return 0}var Ji=[{version:`0.11.0`,date:`2026-10-23`,sections:[{title:`Added`,items:['Several agents can now work on one project at once. Run `/atm:loop-tasks` in more than one session, ideally each in its own git worktree: they never take the same task or overwrite each other\'s changes to `tasks.json`. See "Running agents in parallel" in the README.',"Claims: the skills take each task with `atm next --claim`, which records the agent, branch and worktree. All worktrees of a clone share the claims. A claim lasts 30 minutes and is renewed during long tasks; if an agent stops, its task becomes available again when the claim runs out.",`The dashboard shows who works on each in-progress task, on which branch and since when (cards, Kanban board and task details).`,"`tasks.json` merges task by task: status changes from different branches combine, and tasks added on both branches are both kept. A git merge driver for this is registered automatically."]},{title:`Changed`,items:["`/atm:do-task` and `/atm:loop-tasks` change task status only through the plugin's helper, which locks `tasks.json` and writes it atomically, so the dashboard never reads a half-written file.","The skills commit only the files a task changed plus `tasks.json`, instead of everything in the working tree.","A failed task records why in `last_failure`."]}]},{version:`0.10.0`,date:`2026-10-23`,sections:[{title:`Added`,items:["`/atm:serve` starts the dashboard in a background server (`--open` opens the browser, `stop` and `status` manage it). It uses port 8000 or the next free one, keeps running after the session ends, and only ever stops the server it started for this project.","Everything atm needs now lives in one folder, `.agentic-task-manager/`, at the root of your project."]},{title:`Changed`,items:["Projects that keep `tasks.json` in `docs/` or the project root are moved into `.agentic-task-manager/` the first time a skill runs, with `git mv` so history is kept. The move is staged for you to commit; `/atm:loop-tasks` commits it on its own before its first task.","The dashboard HTML is no longer committed to your repository. It's a copy of the plugin's dashboard, listed in `.agentic-task-manager/.gitignore`, and the skills bring it up to date automatically when they run.","The skills use a small helper script that needs **Python 3.9 or newer** (standard library only, nothing to install). On macOS it comes with the Command Line Tools, like `git`.","Updating the plugin: run `/plugin marketplace update hakanserce-plugins`, then `/reload-plugins`. No restart."]}]},{version:`0.9.0`,date:`2026-10-23`,sections:[{title:`Added`,items:[`**Progress** tab: a burndown chart of remaining work and total scope over time, with a forecast to the estimated finish. Click a phase to see only that phase.`,`Per-phase table with progress, remaining work and a completion estimate, e.g. "≈ 1 h 10 m of agent work (50 m – 1 h 40 m)", plus the clock time if the loop keeps running. Estimates use the median time per task over the last 10 completed tasks and follow the loop's phase order; blocked work is flagged, not estimated.`,"Estimates use `started_at`/`completed_at` when present (written by the skills since 0.7.0). Older task files still work: the time between completions is used instead, with idle gaps capped at 30 minutes."]}]},{version:`0.8.0`,date:`2026-10-23`,sections:[{title:`Added`,items:[`Kanban board: the dependency graph now shares its panel with a **Kanban** tab (and a Progress tab, coming next). The selected tab is part of the URL, so a reload or a shared link opens the same view.`,"Kanban columns for Todo, In Progress, Blocked and Done (Skipped on request). Todo cards say whether they are ready or which tasks they are waiting on, and **Next up** marks the task `/atm:loop-tasks` will pick next.",`Optional "Group by phase" swimlanes on the Kanban board, remembered per browser.`]},{title:`Changed`,items:[`The graph keeps its zoom and position while you look at another tab.`]}]},{version:`0.7.0`,date:`2026-10-22`,sections:[{title:`Added`,items:[`Release notes in the dashboard: the version next to the title opens a "What's new" panel, and shows a "new" marker after an upgrade until you've opened it.`]},{title:`Changed`,items:[`Auto-refresh is now on by default (every 5 seconds), and the dashboard remembers whether you switched it off and which interval you chose.`,`The dependency graph keeps its zoom level when filters change or a reload changes the visible tasks. It only pans when no task would be left on screen.`,"`/atm:do-task` and `/atm:loop-tasks` record when each task started (`started_at`) and was completed (`completed_at`). The activity timeline uses the completion time."]},{title:`Fixed`,items:["`/atm:update-dashboard` looked for the new dashboard one directory too high inside the installed plugin, and now prints the actual release notes between your old and new version instead of a summary it made up."]}]},{version:`0.6.0`,date:`2026-10-22`,sections:[{title:`Added`,items:[`Dependency graph zoom and pan: drag to pan, Ctrl/⌘ + scroll or pinch to zoom, zoom/fit/1:1 buttons, keyboard shortcuts when the graph has focus, and a clickable minimap when the graph doesn't fit.`,`Large graphs open at a readable scale, centered on the task in progress; small graphs open at 100% instead of being stretched to the page width.`]}]},{version:`0.5.0`,date:`2026-10-22`,sections:[{title:`Changed`,items:[`The dashboard was rebuilt (Svelte 5) with an automated test suite. It looks and behaves the same as before.`,`Filter buttons and the browser tab title now update when tasks.json is reloaded.`]},{title:`Fixed`,items:[`Task names and descriptions are shown as plain text. Previously, HTML in tasks.json was rendered as markup.`,"Installation instructions in the README use the correct plugin name (`atm@hakanserce-plugins`)."]}]},{version:`0.4.0`,date:`2026-04-05`,sections:[{title:`Added`,items:["Task timestamps: `created_at` and `updated_at`.",`Activity timeline on the dashboard showing when tasks were completed.`,"`/atm:update-dashboard` to copy the latest dashboard into a project."]},{title:`Changed`,items:["`/atm:loop-tasks` commits after each task by default (`--no-commit` to opt out)."]}]},{version:`0.3.0`,date:`2026-04-04`,sections:[{title:`Changed`,items:["The plugin lives in its own `plugin/` directory, separate from the marketplace configuration."]}]},{version:`0.2.0`,date:`2026-04-04`,sections:[{title:`Changed`,items:["The plugin is now called `atm`, so skills are `/atm:create-tasks`, `/atm:do-task`, `/atm:loop-tasks`.","Repository restructured to follow Claude Code plugin conventions; installable from the `hakanserce-plugins` marketplace."]}]},{version:`0.1.0`,date:`2026-04-03`,sections:[{title:`Added`,items:["Initial release: skills to decompose requirements into `tasks.json`, execute one task, and loop through all tasks, plus a self-contained HTML dashboard with stats, filters, task cards and a dependency graph."]}]}];function Yi(e=document){return e.querySelector(`meta[name="atm-dashboard-version"]`)?.content||void 0}var Xi=K(`<span class="version-new">new</span>`),Zi=K(`<button id="version-chip" title="What's new"> <!></button>`),Qi=K(`<div class="title-row"><h1 id="dashboard-title"> </h1> <!></div> <p class="subtitle" id="subtitle"><!></p>`,1);function $i(e,t){A(t,!0);let n=Yi(),r=Pi(`lastSeenVersion`,``),i=F(Ht(!!n&&Mi()&&(r===``||qi(n,r)>0)));function a(){$.openWhatsNew(),n&&Fi(`lastSeenVersion`,n),I(i,!1)}let o=N(()=>$.loaded?$.projectName+` — Task Dashboard`:`Task Dashboard`),s=N(()=>new Set($.tasks.map(e=>e.phase)).size);un(()=>{document.title=W(o)});var c=Qi(),l=R(c),u=L(l),d=z(u,!0),f=B(u,2),p=e=>{var t=Zi();let r;var o=L(t),s=B(o),c=e=>{q(e,Xi())};Y(s,e=>{W(i)&&e(c)}),O(t),V(()=>{r=Xr(t,1,`version-chip`,null,r,{unseen:W(i)}),J(o,`v${n??``}`)}),G(`click`,t,a),q(e,t)};Y(f,e=>{n&&e(p)}),O(l);var m=B(l,2),h=L(m),g=e=>{var t=Sr();V(()=>J(t,`${$
