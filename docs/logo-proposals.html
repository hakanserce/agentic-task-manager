<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATM logo proposals</title>
    <!-- T-195: three candidates for the ATM logo, at favicon size and up, on light and dark. Sources:
         dashboard/src/assets/logo-proposals/*.svg (the same paths, inlined here so the page works on its own) -->
    <style>
      body {
        font: 14px/1.5 system-ui, sans-serif;
        margin: 24px;
        background: #f6f7f9;
        color: #1f2328;
      }
      h1 {
        font-size: 20px;
      }
      .option {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 16px 0 32px;
        max-width: 760px;
      }
      .panel {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 16px 20px;
        border-radius: 10px;
      }
      .light {
        background: #ffffff;
        color: #1f2328;
        border: 1px solid #d0d7de;
      }
      .dark {
        background: #0d1117;
        color: #e6edf3;
      }
      .accent {
        color: #2f81f7;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 16px;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>ATM logo: pick one</h1>
    <p>Each is drawn with <code>currentColor</code>, so it takes the theme's text or accent colour. Shown at 16, 24 and
      48 px, and next to the title as in the title bar.</p>

    <div hidden>
      <svg id="a" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="26" height="24" rx="5" />
        <path d="M10 10v12M16 10v6M22 10v3" />
        <path d="M19.5 20.5l2 2 4-4.5" />
      </svg>
      <svg id="b" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M26.5 12A11 11 0 1 0 27 18" />
        <path d="M27.5 6.5V12.5H21.5" />
        <path d="M11 16.5l3.5 3.5 6.5-7" />
      </svg>
      <svg id="c" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7.5l2.5 2.5 4-4.5M4 16.5l2.5 2.5 4-4.5" />
        <rect x="4.5" y="23" width="5.5" height="5.5" rx="1.5" />
        <path d="M15 8h13M15 17h13M15 26h9" />
      </svg>
    </div>

    <h2>A: the board</h2>
    <div class="option" data-logo="a"></div>
    <h2>B: the loop</h2>
    <div class="option" data-logo="b"></div>
    <h2>C: the task list</h2>
    <div class="option" data-logo="c"></div>

    <script>
      function logo(id, size, cls) {
        const svg = document.getElementById(id).cloneNode(true);
        svg.removeAttribute('id');
        svg.setAttribute('width', size);
        svg.setAttribute('height', size);
        if (cls) svg.setAttribute('class', cls);
        return svg;
      }
      for (const option of document.querySelectorAll('.option')) {
        const id = option.dataset.logo;
        for (const theme of ['light', 'dark']) {
          const panel = document.createElement('div');
          panel.className = `panel ${theme}`;
          for (const size of [16, 24, 48]) panel.append(logo(id, size));
          const title = document.createElement('span');
          title.className = 'title';
          title.append(logo(id, 22, 'accent'), 'Agentic Task Manager');
          panel.append(title);
          option.append(panel);
        }
      }
    </script>
  </body>
</html>
