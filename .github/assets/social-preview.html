<!doctype html>
<!-- GitHub's social preview card (1280×640), shown when the repository is linked. Made into social-preview.png with
     `npx playwright screenshot --viewport-size=1280,640 file://<this file> <its folder>/social-preview.png` (run in
     dashboard/, where Playwright is installed), then uploaded in Settings → General → Social preview -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>atm social preview</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      img {
        width: 180px;
        height: 180px;
      }
      h1 {
        margin: 0;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -1px;
      }
      p {
        margin: 0;
        max-width: 1100px;
        text-align: center;
        font-size: 28px;
        line-height: 1.4;
        color: #8b949e;
      }
    </style>
  </head>
  <body>
    <img src="atm-logo.svg" alt="" />
    <h1>Agentic Task Manager</h1>
    <p>Task management for Claude Code agents, with a live dashboard of every project.</p>
  </body>
</html>
