# Only the model API (and Claude Code's own Anthropic endpoints) get out; every request is logged for the verdict
http_port 3128
acl model_api dstdomain .anthropic.com
acl CONNECT method CONNECT
http_access allow CONNECT model_api
http_access allow model_api
http_access deny all
access_log /var/log/squid/proxy.log
cache deny all
