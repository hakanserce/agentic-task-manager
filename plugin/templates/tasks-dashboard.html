 project selector and next to the title.`,`Project cards show rings for the phases you're working on, and line up neatly.`,`"Needs you" takes you straight to the task waiting for you, or lists them.`,`"Active phases only" now shows what's in progress plus the phase you just finished, and is on by default.`,`Agents working in parallel no longer take each other's tasks, and a question answered once counts everywhere.`]}]},{version:`0.16.0`,date:`2026-10-26`,sections:[{title:``,items:[`Agents working in separate git worktrees all show on one board, each task with the branch it's on.`,`Commits and pull requests in a task's details link to GitHub, GitLab, Bitbucket or Codeberg.`,`Progress leaves out skipped tasks, so a phase with only skipped tasks left counts as finished.`,`Task details show when work started, when it finished and how long it took.`,`When an agent's time on a task ran out, it now says so and how to carry on.`]}]},{version:`0.15.0`,date:`2026-10-25`,sections:[{title:``,items:[`One dashboard now shows all your projects: switch between them with the arrow next to the title.`,`**All projects** shows every project at a glance: its progress, what it's working on, and what needs you.`,`The dashboard comes with the plugin, so updating the plugin updates it. No more updating each project.`,`When a new version is ready, the open dashboard offers to reload.`,"Open it with `/atm:serve`, which you only need once for all your projects."]}]},{version:`0.14.0`,date:`2026-10-25`,sections:[{title:``,items:[`Five more colour themes: Ayu, Night Owl, Gruvbox, Noctis and Sublime Material, each in light and dark.`,`Pick a theme with the arrow keys; the menu opens on the one you use.`,`The Progress tab can show only the phases you're working on, hiding ones finished a while ago.`,`Task descriptions show formatting: headings, lists, code and links.`,`Activity titles say which period you picked, such as "this week".`,`What's new (this list) is now short and written for you; the full details stay in the changelog.`]}]},{version:`0.13.0`,date:`2026-10-24`,sections:[{title:``,items:[`Agents can ask you a question instead of guessing, or hand finished work to you for review. The dashboard tells you when a task needs you.`,"Push your work and get CI green with `/atm:push`, straight to your main branch or through a pull request.",`Tasks can have priorities and labels, and your project can name its own statuses, phases and types.`,`Each task shows who created, started and finished it, notes from the agents, and its pull request.`,`Old finished tasks can be archived, so big projects stay fast.`,`Help and About in the footer explain the dashboard.`]}]},{version:`0.12.0`,date:`2026-10-24`,sections:[{title:``,items:[`Light and dark mode, and six colour themes.`,`A new top bar with your progress and recent activity; click either for the details.`,`Search tasks by keyword, and see how many tasks each filter would show.`,`An Agents tab shows who worked on what, and when.`,`The dashboard remembers your filters, tab and view for each project.`]}]},{version:`0.11.0`,date:`2026-10-23`,sections:[{title:``,items:[`Several agents can work on one project at once without getting in each other's way.`,`The dashboard shows which agent is working on each task.`,`Branches that changed different tasks now merge cleanly.`]}]},{version:`0.10.0`,date:`2026-10-23`,sections:[{title:``,items:["`/atm:serve` starts the dashboard for you in the background.","Everything atm needs now lives in one folder in your project, `.agentic-task-manager/`.",`atm now needs Python 3.9 or newer, which macOS already has with its developer tools.`]}]},{version:`0.9.0`,date:`2026-10-23`,sections:[{title:``,items:[`A Progress tab with a burndown chart and an estimate of the work left in each phase.`]}]},{version:`0.8.0`,date:`2026-10-23`,sections:[{title:``,items:[`A Kanban board, with a "Next up" marker on the task the agent will pick next.`]}]},{version:`0.7.0`,date:`2026-10-22`,sections:[{title:``,items:[`This What's new panel.`,`The dashboard refreshes itself every 5 seconds by default.`]}]},{version:`0.6.0`,date:`2026-10-22`,sections:[{title:``,items:[`Zoom and pan the dependency graph, with a minimap for large ones.`]}]},{version:`0.5.0`,date:`2026-10-22`,sections:[{title:``,items:[`A rebuilt dashboard that looks the same, and is now tested automatically.`]}]},{version:`0.4.0`,date:`2026-04-05`,sections:[{title:``,items:["An activity timeline, and `/atm:update-dashboard` to get the latest dashboard."]}]},{version:`0.3.0`,date:`2026-04-04`,sections:[{title:``,items:[`Internal changes only.`]}]},{version:`0.2.0`,date:`2026-04-04`,sections:[{title:``,items:["The plugin is now called `atm`: `/atm:create-tasks`, `/atm:do-task`, `/atm:loop-tasks`."]}]},{version:`0.1.0`,date:`2026-04-03`,sections:[{title:``,items:[`First release: turn requirements into tasks, let agents work through them, and watch it all on a live dashboard.`]}]}];function Qa(e=document){return e.querySelector(`meta[name="atm-dashboard-version"]`)?.content||void 0}function $a(e=document){return e.querySelector(`meta[name="atm-dashboard-build"]`)?.content||void 0}var eo=[`todo`,`active`,`review`,`blocked`,`done`,`skipped`],to=[{id:`todo`,label:`To Do`,kind:`todo`},{id:`in_progress`,label:`In Progress`,kind:`active`},{id:`in_review`,label:`In Review`,kind:`review`},{id:`blocked`,label:`Blocked`,kind:`blocked`},{id:`done`,label:`Done`,kind:`done`},{id:`skipped`,label:`Skipped`,kind:`skipped`}],no=[`feature`,`bugfix`,`test`,`infra`,`docs`,`refactor`,`polish`].map(e=>({id:e,label:ao(e)})),ro=[{id:`P0`,label:`Critical`},{id:`P1`,label:`High`},{id:`P2`,label:`Medium`},{id:`P3`,label:`Low`}],io={statuses:to,types:no,priorities:ro,defaultPriority:`P2`,phaseNames:new Map,labels:[]};function ao(e){return e.charAt(0).toUpperCase()+e.slice(1)}function oo(e){return ao(e.replace(/_/g,` `))}var so=e=>typeof e==`object`&&!!e,co=e=>typeof e==`string`&&e!==``;function lo(e){if(!Array.isArray(e)||e.length=== k mode, and one of 11 themes, picked from a drop-down list.`}]]},{t:`heading`,level:2,id:`views`,children:[{t:`text`,text:`Views`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`Dependency Graph`}]},{t:`text`,text:` — tasks as boxes, in the order their dependencies allow. Drag to move, use the buttons or Ctrl/⌘ + scroll to zoom. Click a task for its details.`}],[{t:`strong`,children:[{t:`text`,text:`Kanban Board`}]},{t:`text`,text:` — a column per status. To Do shows which tasks are ready and which one the loop takes next. Group the board by phase, or show skipped tasks, with the options above it.`}],[{t:`strong`,children:[{t:`text`,text:`Task List`}]},{t:`text`,text:` — every task as a card, in the file's order or by priority.`}],[{t:`strong`,children:[{t:`text`,text:`Agents`}]},{t:`text`,text:` — who worked on what, and when: a lane per agent (🤖) or person (👤), with a bar per task. A green mark at the end of a bar means someone else completed it, usually a reviewer approving it. Zoom and move the time range, or tick `},{t:`strong`,children:[{t:`text`,text:`Live`}]},{t:`text`,text:` to follow the current time.`}],[{t:`strong`,children:[{t:`text`,text:`Progress`}]},{t:`text`,text:` — each phase's progress and an estimate of the agent work left, a burndown chart, and how busy the agents have been.`}]]},{t:`heading`,level:2,id:`filters-and-saved-views`,children:[{t:`text`,text:`Filters and saved views`}]},{t:`paragraph`,children:[{t:`strong`,children:[{t:`text`,text:`Filters`}]},{t:`text`,text:` narrows every view by phase, type, status, priority, stage, label and who started the task (the last three appear when the project uses them); the search box matches task IDs, names, descriptions, types and labels. Within a group, any selected value matches; across groups, all must match. Each button says how many tasks it would show.`}]},{t:`paragraph`,children:[{t:`text`,text:`The dashboard remembers your filters, search, tab and options `},{t:`strong`,children:[{t:`text`,text:`per project`}]},{t:`text`,text:`, so they are back the next time you open it. `},{t:`strong`,children:[{t:`text`,text:`Reset view`}]},{t:`text`,text:` forgets them.`}]},{t:`heading`,level:2,id:`statuses-and-kinds`,children:[{t:`text`,text:`Statuses and kinds`}]},{t:`paragraph`,children:[{t:`text`,text:`Each status has a `},{t:`strong`,children:[{t:`text`,text:`kind`}]},{t:`text`,text:`, which decides what it means:`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`To Do`}]},{t:`text`,text:` (kind `},{t:`code`,text:`todo`},{t:`text`,text:`) — not started.`}],[{t:`strong`,children:[{t:`text`,text:`In Progress`}]},{t:`text`,text:` (`},{t:`code`,text:`active`},{t:`text`,text:`) — an agent is working on it.`}],[{t:`strong`,children:[{t:`text`,text:`In Review`}]},{t:`text`,text:` (`},{t:`code`,text:`review`},{t:`text`,text:`) — the work is finished and waits for approval by you or another agent. Cards say how long it has waited. It doesn't count as agent work.`}],[{t:`strong`,children:[{t:`text`,text:`Blocked`}]},{t:`text`,text:` (`},{t:`code`,text:`blocked`},{t:`text`,text:`) — it can't go on until someone decides something (below).`}],[{t:`strong`,children:[{t:`text`,text:`Done`}]},{t:`text`,text:` (`},{t:`code`,text:`done`},{t:`text`,text:`) — finished. Only done tasks let the tasks that depend on them start.`}],[{t:`strong`,children:[{t:`text`,text:`Skipped`}]},{t:`text`,text:` (`},{t:`code`,text:`skipped`},{t:`text`,text:`) — won't be done.`}]]},{t:`paragraph`,children:[{t:`text`,text:`A project can name its own statuses in `},{t:`code`,text:`tasks.json`},{t:`text`,text:`; they look like the built-in status of their kind. `},{t:`strong`,children:[{t:`text`,text:`About`}]},{t:`text`,text:` lists the ones this project uses.`}]},{t:`heading`,level:2,id:`waiting-on-you`,children:[{t:`text`,text:`Waiting on you`}]},{t:`paragraph`,children:[{t:`text`,text:`An agent that can't go on without a decision asks instead of guessing:
