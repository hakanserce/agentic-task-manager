name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate Linux screenshot baselines and upload them as an artifact
        type: boolean
        default: false

defaults:
  run:
    working-directory: dashboard

jobs:
  check:
    name: Lint, unit tests, build freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: node scripts/check-versions.mjs
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      # The plugin ships the committed build output; it must match the sources (CI never commits it for you)
      - name: Built dashboard is up to date
        run: |
          git diff --exit-code -- ../plugin/templates/tasks-dashboard.html || {
            echo "::error::plugin/templates/tasks-dashboard.html is stale. Run 'npm run build' in dashboard/ and commit it."
            exit 1
          }

  scripts:
    name: atm helper (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version (what macOS's Command Line Tools ship), and a current one
        python: ['3.9', '3.13']
    # The official Python images (Debian, with git) rather than setup-python, which has no build of old versions for
    # newer Ubuntu runners
    container: python:${{ matrix.python }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: python3 --version && git --version
      # The test runner is Node (node:test); the helper under test is Python
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/scripts/run.mjs

  e2e:
    name: Playwright regression suite
    runs-on: ubuntu-latest
    # Pinned image = pinned fonts/rendering, so Linux screenshot baselines are reproducible
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      # Baselines are per platform. Any macOS baseline without a Linux counterpart (new, or deleted because the UI
      # changed on purpose) is generated here in the pinned container, uploaded, and the job fails until the
      # generated files are committed. update-snapshots regenerates all Linux baselines.
      - name: Check for missing Linux screenshot baselines
        id: baselines
        shell: bash
        run: |
          missing=0
          for f in $(find tests/e2e/__screenshots__ -name '*-darwin.png'); do
            [ -f "${f%-darwin.png}-linux.png" ] || { echo "missing: ${f%-darwin.png}-linux.png"; missing=1; }
          done
          if [ "${{ inputs.update-snapshots }}" = "true" ]; then mode=all; elif [ $missing = 1 ]; then mode=missing; else mode=none; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "generate=$([ $mode = none ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: Generate screenshot baselines
        if: steps.baselines.outputs.generate == 'true'
        run: npx playwright test visual --update-snapshots=${{ steps.baselines.outputs.mode }}
      - uses: actions/upload-artifact@v4
        if: steps.baselines.outputs.generate == 'true'
        with:
          name: linux-screenshot-baselines
          path: dashboard/tests/e2e/__screenshots__/
      - name: Baselines must be committed
        if: steps.baselines.outputs.generate == 'true'
        run: |
          echo "::error::Linux screenshot baselines were generated, not compared. Download the linux-screenshot-baselines artifact, commit its new *-linux.png files under dashboard/tests/e2e/__screenshots__/, and push."
          exit 1
      - name: Run e2e tests
        if: steps.baselines.outputs.generate == 'false'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
