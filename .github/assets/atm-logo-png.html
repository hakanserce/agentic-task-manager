<!doctype html>
<!-- The atm logo as a 512×512 PNG (atm-logo.png), for places that take only PNG, JPG or GIF: the org's avatar on
     GitHub. Made with `npx playwright screenshot --viewport-size=512,512 file://<this file> <its folder>/atm-logo.png`
     (run in dashboard/, where Playwright is installed) -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>atm logo</title>
    <style>
      html,
      body {
        margin: 0;
        width: 512px;
        height: 512px;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1117;
      }
      img {
        width: 360px;
        height: 360px;
      }
    </style>
  </head>
  <body>
    <img src="atm-logo.svg" alt="" />
  </body>
</html>
