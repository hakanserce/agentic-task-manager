 one off.`}],[{t:`text`,text:`Updating the plugin updates this dashboard: when a new version is ready, a bar offers to reload.`}]]},{t:`heading`,level:2,id:`the-top-bar`,children:[{t:`text`,text:`The top bar`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`Progress`}]},{t:`text`,text:` — the share of tasks done. Click it for the split by status, phase and type.`}],[{t:`strong`,children:[{t:`text`,text:`Activity`}]},{t:`text`,text:` — tasks completed over time. Click it for the details: completions by type, agents at work, time per task and idle stretches, for a period you choose.`}],[{t:`strong`,children:[{t:`text`,text:`N need you`}]},{t:`text`,text:` — tasks waiting for your review or for your answer. Click it for the Kanban board.`}],[{t:`strong`,children:[{t:`text`,text:`Refresh`}]},{t:`text`,text:` — reload now, or change how often the dashboard reloads by itself.`}],[{t:`strong`,children:[{t:`text`,text:`Appearance`}]},{t:`text`,text:` — light or dark mode, and one of 11 themes (the arrow keys move through them).`}]]},{t:`heading`,level:2,id:`views`,children:[{t:`text`,text:`Views`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`Dependency Graph`}]},{t:`text`,text:` — tasks as boxes, in the order their dependencies allow. Drag to move, use the buttons or Ctrl/⌘ + scroll to zoom. Click a task for its details.`}],[{t:`strong`,children:[{t:`text`,text:`Kanban Board`}]},{t:`text`,text:` — a column per status. To Do shows which tasks are ready and which one the loop takes next. Group the board by phase, or show skipped tasks, with the options above it.`}],[{t:`strong`,children:[{t:`text`,text:`Task List`}]},{t:`text`,text:` — every task as a card, in the file's order or by priority.`}],[{t:`strong`,children:[{t:`text`,text:`Agents`}]},{t:`text`,text:` — who worked on what, and when: a lane per agent (🤖) or person (👤), with a bar per task. A green mark at the end of a bar means someone else completed it, usually a reviewer approving it. Zoom and move the time range, or tick `},{t:`strong`,children:[{t:`text`,text:`Live`}]},{t:`text`,text:` to follow the current time.`}],[{t:`strong`,children:[{t:`text`,text:`Progress`}]},{t:`text`,text:` — each phase's progress and an estimate of the agent work left, a burndown chart, and how busy the agents have been.`}]]},{t:`heading`,level:2,id:`filters-and-saved-views`,children:[{t:`text`,text:`Filters and saved views`}]},{t:`paragraph`,children:[{t:`strong`,children:[{t:`text`,text:`Filters`}]},{t:`text`,text:` narrows every view by phase, type, status, priority, stage, label and who started the task (the last three appear when the project uses them); the search box matches task IDs, names, descriptions, types and labels. Within a group, any selected value matches; across groups, all must match. Each button says how many tasks it would show.`}]},{t:`paragraph`,children:[{t:`text`,text:`The dashboard remembers your filters, search, tab and options `},{t:`strong`,children:[{t:`text`,text:`per project`}]},{t:`text`,text:`, so they are back the next time you open it. `},{t:`strong`,children:[{t:`text`,text:`Reset view`}]},{t:`text`,text:` forgets them.`}]},{t:`heading`,level:2,id:`statuses-and-kinds`,children:[{t:`text`,text:`Statuses and kinds`}]},{t:`paragraph`,children:[{t:`text`,text:`Each status has a `},{t:`strong`,children:[{t:`text`,text:`kind`}]},{t:`text`,text:`, which decides what it means:`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`To Do`}]},{t:`text`,text:` (kind `},{t:`code`,text:`todo`},{t:`text`,text:`) — not started.`}],[{t:`strong`,children:[{t:`text`,text:`In Progress`}]},{t:`text`,text:` (`},{t:`code`,text:`active`},{t:`text`,text:`) — an agent is working on it.`}],[{t:`strong`,children:[{t:`text`,text:`In Review`}]},{t:`text`,text:` (`},{t:`code`,text:`review`},{t:`text`,text:`) — the work is finished and waits for approval by you or another agent. Cards say how long it has waited. It doesn't count as agent work.`}],[{t:`strong`,children:[{t:`text`,text:`Blocked`}]},{t:`text`,text:` (`},{t:`code`,text:`blocked`},{t:`text`,text:`) — it can't go on until someone decides something (below).`}],[{t:`strong`,children:[{t:`text`,text:`Done`}]},{t:`text`,text:` (`},{t:`code`,text:`done`},{t:`text`,text:`) — finished. Only done tasks let the tasks that depend on them start.`}],[{t:`strong`,children:[{t:`text`,text:`Skipped`}]},{t:`text`,text:` (`},{t:`code`,text:`skipped`},{t:`text`,text:`) — won't be done.`}]]},{t:`paragraph`,children:[{t:`text`,text:`A project can name its own statuses in `},{t:`code`,text:`tasks.json`},{t:`text`,text:`; they look like the built-in status of their kind. `},{t:`strong`,children:[{t:`text`,text:`About`}]},{t:`text`,text:` lists the ones this project uses.`}]},{t:`heading`,level:2,id:`waiting-on-you`,children:[{t:`text`,text:`Waiting on you`}]},{t:`paragraph`,children:[{t:`text`,text:`An agent that can't go on without a decision asks instead of guessing: the task is `},{t:`strong`,children:[{t:`text`,text:`Blocked`}]},{t:`text`,text:`, and its card says `},{t:`strong`,children:[{t:`text`,text:`Waiting on you`}]},{t:`text`,text:` (or `},{t:`strong`,children:[{t:`text`,text:`on an agent`}]},{t:`text`,text:`), for how long, and how many questions. The task's details list the questions. Answer them in Claude Code, or with `},{t:`code`,text:`atm unblock <id> --answer "…"`},{t:`text`,text:` (one answer per question); the task goes back to To Do with your answers attached for the next agent.`}]},{t:`paragraph`,children:[{t:`text`,text:`A task `},{t:`strong`,children:[{t:`text`,text:`In Review`}]},{t:`text`,text:` waits for you to look at it: pass it with `},{t:`code`,text:`atm done <id>`},{t:`text`,text:`, or send it back with `},{t:`code`,text:`atm reject <id> --reason "…"`},{t:`text`,text:`.`}]},{t:`heading`,level:2,id:`priorities-and-labels`,children:[{t:`text`,text:`Priorities and labels`}]},{t:`paragraph`,children:[{t:`text`,text:`Agents take tasks phase by phase and, within a phase, the most urgent first:`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`P0`}]},{t:`text`,text:` Critical / Required`}],[{t:`strong`,children:[{t:`text`,text:`P1`}]},{t:`text`,text:` High`}],[{t:`strong`,children:[{t:`text`,text:`P2`}]},{t:`text`,text:` Medium (tasks without a priority count as this)`}],[{t:`strong`,children:[{t:`text`,text:`P3`}]},{t:`text`,text:` Low / Nice to have`}]]},{t:`paragraph`,children:[{t:`strong`,children:[{t:`text`,text:`Labels`}]},{t:`text`,text:` are tags that group tasks across phases and types, such as `},{t:`code`,text:`spike-2`},{t:`text`,text:` or `},{t:`code`,text:`ux`},{t:`text`,text:`. They show as small chips on the cards, and the filter and the search find them.`}]},{t:`heading`,level:2,id:`the-task-details`,children:[{t:`text`,text:`The task details`}]},{t:`paragraph`,children:[{t:`text`,text:`Click a task for everything about it: its description, what it depends on and what depends on it, and`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`Who`}]},{t:`text`,text:` — who created it, started it and completed it, and who worked on it before (from their handoffs);`}],[{t:`strong`,children:[{t:`text`,text:`Notes`}]},{t:`text`,text:` — newest first: handoffs from an agent that had to stop, the outcome, review requests and rejections, your answers, and failures;`}],[{t:`strong`,children:[{t:`text`,text:`Commit`}]},{t:`text`,text:` — the commit that holds the task's work.`}]]},{t:`heading`,level:2,id:`workflows-and-stages`,children:[{t:`text`,text:`Workflows and stages`}]},{t:`paragraph`,children:[{t:`text`,text:`A project pushes its work in one of two ways (`},{t:`strong`,children:[{t:`text`,text:`About`}]},{t:`text`,text:` shows which; `},{t:`code`,text:`/atm:push`},{t:`text`,text:` asks the first time):`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`direct`}]},{t:`text`,text:` — commits go straight to the main branch.`}],[{t:`strong`,children:[{t:`text`,text:`pull-request`}]},{t:`text`,text:` — work goes to a branch and reaches the main branch through a pull request.`}]]},{t:`paragraph`,children:[{t:`text`,text:`A done task can be further along: `},{t:`strong`,children:[{t:`text`,text:`In PR`}]},{t:`text`,text:` (its pull request is open; the card links to it) and `},{t:`strong`,children:[{t:`text`,text:`Merged`}]},{t:`text`,text:`. In a pull-request project the Done column is split into these stages. Stages never hold anything up: the tasks that depend on a task can start as soon as it is done.`}]},{t:`heading`,level:2,id:`the-archive`,children:[{t:`text`,text:`The archive`}]},{t:`paragraph`,children:[{t:`text`,text:`Finished tasks pile up. `},{t:`code`,text:`atm archive`},{t:`text`,text:` moves old ones to `},{t:`code`,text:`tasks-archive.json`},{t:`text`,text:`, so `},{t:`code`,text:`tasks.json`},{t:`text`,text:` stays small and quick to read; agents do it when `},{t:`code`,text:`atm`},{t:`text`,text:` suggests it, and the footer says when the file has grown big enough. The header counts the archived tasks.`}]},{t:`paragraph`,children:[{t:`text`,text:`The dashboard reads the archive only when you need it: the `},{t:`strong`,children:[{t:`text`,text:`Progress`}]},{t:`text`,text:` tab and the activity details count archived work, and `},{t:`strong`,children:[{t:`text`,text:`Include archived`}]},{t:`text`,text:` in the filter bar adds the archived tasks to the search, the lists, the graph and the Agents tab. A task that depends on an archived one shows it as "archived, done".`}]},{t:`heading`,level:2,id:`the-skills`,children:[{t:`text`,text:`The skills`}]},{t:`paragraph`,children:[{t:`text`,text:`Run these in Claude Code:`}]},{t:`list`,ordered:!1,items:[[{t:`code`,text:`/atm:create-tasks`},{t:`text`,text:` — turn your requirements into tasks.`}],[{t:`code`,text:`/atm:do-task`},{t:`text`,text:` — do one task: the next available one, or the one you name.`}],[{t:`code`,text:`/atm:loop-tasks`},{t:`text`,text:` — keep doing tasks until none is left.`}],[{t:`code`,text:`/atm:push`},{t:`text`,text:` — push the work (or open its pull request), watch CI and fix what fails.`}],[{t:`code`,text:`/atm:serve`},{t:`text`,text:` — start or stop this dashboard's server, one for all your projects.`}]]},{t:`heading`,level:2,id:`running-agents-in-parallel`,children:[{t:`text`,text:`Running agents in parallel`}]},{t:`paragraph`,children:[{t:`text`,text:`Several agents can work on one project at once, in one checkout or in separate git worktrees: each agent claims the task it works on, so no two take the same task, and the Kanban board shows who works on what. See `},{t:`link`,href:`https://github.com/hakanserce/agentic-task-manager#running-agents-in-parallel`,children:[{t:`text`,text:`Running agents in parallel`}]},{t:`text`,text:` in the README.`}]}];function ym(e,t){A(t,!1),ta();{let t=_t(()=>$.dialog===`help`);mm(e,{id:`help`,title:`Help`,get open(){return U(t)},onclose:()=>$.closeDialog(),children:(e,t)=>{yp(e,{get blocks(){return vm},idPrefix:`help-`})},$$slots:{default:!0}})}j()}var bm=864e5;function xm(e){return e.summary?e.summary.needs_you.review+e.summary.needs_you.blocked_on_user:0}function Sm(e){return e.summary?e.summary.total-e.summary.done-e.summary.skipped:0}function Cm(e){let t=Date.parse(e.summary?.last_activity??``);return Number.isNaN(t)?-1/0:t}function wm(e,t,n=14){return e.missing||!e.summary?!0:Sm(e)>0||Cm(e)>=t-n*bm}function Tm(e){return[...e].sort((e,t)=>Number(e.missing)-Number(t.missing)||Number(xm(t)>0)-Number(xm(e)>0)||Cm(t)-Cm(e)||e.name.localeCompare(t.name))}var Em=G(`<h3 class="project-card-name"> </h3>`),Dm=G(`<h3 class="project-card-name"><button class="project-card-open"> </button></h3>`),Om=G(`<button class="attention-chip project-card-need" title="Open its Kanban board, filtered to the tasks in review and blocked"> </button>`),km=G(`<p class="project-card-note">Not found: its folder or tasks.json is gone. Remove it with <
