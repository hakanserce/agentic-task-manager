<!doctype html>
<!-- T-195: the ATM logo candidates (the .svg files next to this one) at 16, 32 and 64 px, on light and dark, and in
     an accent colour. Open this file in a browser. The SVGs are copied in so currentColor follows each section's text
     colour, as it will in the dashboard (and so it works from file://). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ATM logo candidates</title>
    <style>
      body {
        margin: 0;
        font: 14px system-ui, sans-serif;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      section {
        padding: 24px;
      }
      .light {
        background: #ffffff;
        color: #1f2328;
      }
      .dark {
        background: #0d1117;
        color: #e6edf3;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 24px;
        margin: 20px 0;
      }
      .row b {
        width: 100px;
      }
      .row span {
        display: inline-flex;
      }
      .row svg {
        width: 100%;
        height: 100%;
      }
      .accent {
        color: #2f81f7;
      }
    </style>
  </head>
  <body>
    <section class="light"><h2>Light</h2></section>
    <section class="dark"><h2>Dark</h2></section>
    <script>
      const logos = {
        'A · graph': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="3.5" cy="4" r="2"/><circle cx="3.5" cy="12" r="2"/><path d="M5.5 4.6 9 7.2M5.5 11.4 9 8.8"/><circle cx="12" cy="8" r="3.2"/><path d="m10.6 8 1 1 1.8-2"/></svg>`,
        'B · ring': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.6A6.4 6.4 0 1 1 1.6 8"/><path d="M1.6 8A6.4 6.4 0 0 1 8 1.6" opacity="0.35"/><path d="m5.3 8.2 1.9 1.9 3.6-4"/></svg>`,
        'C · board': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="4" height="3" rx="1" opacity="0.45"/><rect x="1" y="6.5" width="4" height="3" rx="1" opacity="0.45"/><rect x="1" y="11" width="4" height="3" rx="1" opacity="0.45"/><rect x="6" y="2" width="4" height="3" rx="1" opacity="0.7"/><rect x="6" y="6.5" width="4" height="3" rx="1" opacity="0.7"/><rect x="11" y="2" width="4" height="3" rx="1"/></svg>`,
      };
      for (const section of document.querySelectorAll('section')) {
        for (const [name, svg] of Object.entries(logos)) {
          const sizes = [16, 32, 64].map((s) => `<span style="width:${s}px;height:${s}px">${svg}</span>`).join('');
          const accent = `<span class="accent" style="width:32px;height:32px">${svg}</span>`;
          section.insertAdjacentHTML('beforeend', `<div class="row"><b>${name}</b>${sizes}${accent}</div>`);
        }
      }
    </script>
  </body>
</html>
