`strong`,children:[{t:`text`,text:`kind`}]},{t:`text`,text:`, which decides what it means:`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`To Do`}]},{t:`text`,text:` (kind `},{t:`code`,text:`todo`},{t:`text`,text:`) — not started.`}],[{t:`strong`,children:[{t:`text`,text:`In Progress`}]},{t:`text`,text:` (`},{t:`code`,text:`active`},{t:`text`,text:`) — an agent is working on it.`}],[{t:`strong`,children:[{t:`text`,text:`In Review`}]},{t:`text`,text:` (`},{t:`code`,text:`review`},{t:`text`,text:`) — the work is finished and waits for approval by you or another agent. Cards say how long it has waited. It doesn't count as agent work.`}],[{t:`strong`,children:[{t:`text`,text:`Blocked`}]},{t:`text`,text:` (`},{t:`code`,text:`blocked`},{t:`text`,text:`) — it can't go on until someone decides something (below).`}],[{t:`strong`,children:[{t:`text`,text:`Done`}]},{t:`text`,text:` (`},{t:`code`,text:`done`},{t:`text`,text:`) — finished. Only done tasks let the tasks that depend on them start.`}],[{t:`strong`,children:[{t:`text`,text:`Skipped`}]},{t:`text`,text:` (`},{t:`code`,text:`skipped`},{t:`text`,text:`) — won't be done.`}]]},{t:`paragraph`,children:[{t:`text`,text:`A project can name its own statuses in `},{t:`code`,text:`tasks.json`},{t:`text`,text:`; they look like the built-in status of their kind. `},{t:`strong`,children:[{t:`text`,text:`About`}]},{t:`text`,text:` lists the ones this project uses.`}]},{t:`heading`,level:2,id:`waiting-on-you`,children:[{t:`text`,text:`Waiting on you`}]},{t:`paragraph`,children:[{t:`text`,text:`An agent that can't go on without a decision asks instead of guessing: the task is `},{t:`strong`,children:[{t:`text`,text:`Blocked`}]},{t:`text`,text:`, and its card says `},{t:`strong`,children:[{t:`text`,text:`Waiting on you`}]},{t:`text`,text:` (or `},{t:`strong`,children:[{t:`text`,text:`on an agent`}]},{t:`text`,text:`), for how long, and how many questions. The task's details list the questions. Answer them in Claude Code, or with `},{t:`code`,text:`atm unblock <id> --answer "…"`},{t:`text`,text:` (one answer per question); the task goes back to To Do with your answers attached for the next agent.`}]},{t:`paragraph`,children:[{t:`text`,text:`A task `},{t:`strong`,children:[{t:`text`,text:`In Review`}]},{t:`text`,text:` waits for you to look at it: pass it with `},{t:`code`,text:`atm done <id>`},{t:`text`,text:`, or send it back with `},{t:`code`,text:`atm reject <id> --reason "…"`},{t:`text`,text:`.`}]},{t:`heading`,level:2,id:`priorities-and-labels`,children:[{t:`text`,text:`Priorities and labels`}]},{t:`paragraph`,children:[{t:`text`,text:`Agents take tasks phase by phase and, within a phase, the most urgent first:`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`P0`}]},{t:`text`,text:` Critical / Required`}],[{t:`strong`,children:[{t:`text`,text:`P1`}]},{t:`text`,text:` High`}],[{t:`strong`,children:[{t:`text`,text:`P2`}]},{t:`text`,text:` Medium (tasks without a priority count as this)`}],[{t:`strong`,children:[{t:`text`,text:`P3`}]},{t:`text`,text:` Low / Nice to have`}]]},{t:`paragraph`,children:[{t:`strong`,children:[{t:`text`,text:`Labels`}]},{t:`text`,text:` are tags that group tasks across phases and types, such as `},{t:`code`,text:`spike-2`},{t:`text`,text:` or `},{t:`code`,text:`ux`},{t:`text`,text:`. They show as small chips on the cards, and the filter and the search find them.`}]},{t:`heading`,level:2,id:`the-task-details`,children:[{t:`text`,text:`The task details`}]},{t:`paragraph`,children:[{t:`text`,text:`Click a task for everything about it: its description, what it depends on and what depends on it, and`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`Who`}]},{t:`text`,text:` — who created it, started it and completed it, and who worked on it before (from their handoffs);`}],[{t:`strong`,children:[{t:`text`,text:`Notes`}]},{t:`text`,text:` — newest first: handoffs from an agent that had to stop, the outcome, review requests and rejections, your answers, and failures;`}],[{t:`strong`,children:[{t:`text`,text:`Commit`}]},{t:`text`,text:` — the commit that holds the task's work.`}]]},{t:`heading`,level:2,id:`workflows-and-stages`,children:[{t:`text`,text:`Workflows and stages`}]},{t:`paragraph`,children:[{t:`text`,text:`A project pushes its work in one of two ways (`},{t:`strong`,children:[{t:`text`,text:`About`}]},{t:`text`,text:` shows which; `},{t:`code`,text:`/atm:push`},{t:`text`,text:` asks the first time):`}]},{t:`list`,ordered:!1,items:[[{t:`strong`,children:[{t:`text`,text:`direct`}]},{t:`text`,text:` — commits go straight to the main branch.`}],[{t:`strong`,children:[{t:`text`,text:`pull-request`}]},{t:`text`,text:` — work goes to a branch and reaches the main branch through a pull request.`}]]},{t:`paragraph`,children:[{t:`text`,text:`A done task can be further along: `},{t:`strong`,children:[{t:`text`,text:`In PR`}]},{t:`text`,text:` (its pull request is open; the card links to it) and `},{t:`strong`,children:[{t:`text`,text:`Merged`}]},{t:`text`,text:`. In a pull-request project the Done column is split into these stages. Stages never hold anything up: the tasks that depend on a task can start as soon as it is done.`}]},{t:`heading`,level:2,id:`the-archive`,children:[{t:`text`,text:`The archive`}]},{t:`paragraph`,children:[{t:`text`,text:`Finished tasks pile up. `},{t:`code`,text:`atm archive`},{t:`text`,text:` moves old ones to `},{t:`code`,text:`tasks-archive.json`},{t:`text`,text:`, so `},{t:`code`,text:`tasks.json`},{t:`text`,text:` stays small and quick to read; agents do it when `},{t:`code`,text:`atm`},{t:`text`,text:` suggests it, and the footer says when the file has grown big enough. The header counts the archived tasks.`}]},{t:`paragraph`,children:[{t:`text`,text:`The dashboard reads the archive only when you need it: the `},{t:`strong`,children:[{t:`text`,text:`Progress`}]},{t:`text`,text:` tab and the activity details count archived work, and `},{t:`strong`,children:[{t:`text`,text:`Include archived`}]},{t:`text`,text:` in the filter bar adds the archived tasks to the search, the lists, the graph and the Agents tab. A task that depends on an archived one shows it as "archived, done".`}]},{t:`heading`,level:2,id:`the-skills`,children:[{t:`text`,text:`The skills`}]},{t:`paragraph`,children:[{t:`text`,text:`Run these in Claude Code:`}]},{t:`list`,ordered:!1,items:[[{t:`code`,text:`/atm:create-tasks`},{t:`text`,text:` — turn your requirements into tasks.`}],[{t:`code`,text:`/atm:do-task`},{t:`text`,text:` — do one task: the next available one, or the one you name.`}],[{t:`code`,text:`/atm:loop-tasks`},{t:`text`,text:` — keep doing tasks until none is left.`}],[{t:`code`,text:`/atm:push`},{t:`text`,text:` — push the work (or open its pull request), watch CI and fix what fails.`}],[{t:`code`,text:`/atm:serve`},{t:`text`,text:` — start or stop this dashboard's server.`}],[{t:`code`,text:`/atm:update-dashboard`},{t:`text`,text:` — update this dashboard to the plugin's latest version.`}]]},{t:`heading`,level:2,id:`running-agents-in-parallel`,children:[{t:`text`,text:`Running agents in parallel`}]},{t:`paragraph`,children:[{t:`text`,text:`Several agents can work on one project at once, in one checkout or in separate git worktrees: each agent claims the task it works on, so no two take the same task, and the Kanban board shows who works on what. See `},{t:`link`,href:`https://github.com/hakanserce/agentic-task-manager#running-agents-in-parallel`,children:[{t:`text`,text:`Running agents in parallel`}]},{t:`text`,text:` in the README.`}]}],wp=G(`<code> </code>`),Tp=G(`<strong><!></strong>`),Ep=G(`<em><!></em>`),Dp=G(`<a><!></a>`),Op=G(`<a target="_blank" rel="noopener noreferrer"><!></a>`),kp=G(`<p><!></p>`),Ap=G(`<blockquote><!></blockquote>`),jp=G(`<pre><code> </code></pre>`),Mp=G(`<li><!></li>`),Np=G(`<ol></ol>`),Pp=G(`<ul></ul>`),Fp=G(`<div class="markdown"></div>`);function Ip(e,t){A(t,!0);let n=(e,t=d)=>{var i=Hr();Y
