name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Regenerate Linux screenshot baselines and upload them as an artifact
        type: boolean
        default: false

defaults:
  run:
    working-directory: dashboard

jobs:
  check:
    name: Lint, unit tests, build freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: node scripts/check-versions.mjs
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      # The plugin ships the committed build output; it must match the sources (CI never commits it for you)
      - name: Built dashboard is up to date
        run: |
          git diff --exit-code -- ../plugin/templates/tasks-dashboard.html || {
            echo "::error::plugin/templates/tasks-dashboard.html is stale. Run 'npm run build' in dashboard/ and commit it."
            exit 1
          }

  e2e:
    name: Playwright regression suite
    runs-on: ubuntu-latest
    # Pinned image = pinned fonts/rendering, so Linux screenshot baselines are reproducible
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      # Baselines are per platform. If none exist for Linux yet (or a refresh is requested), generate them in this
      # pinned container, upload them, and fail until they are committed to tests/e2e/__screenshots__/.
      - name: Check for Linux screenshot baselines
        id: baselines
        run: |
          if [ "${{ inputs.update-snapshots }}" = "true" ] || ! ls tests/e2e/__screenshots__/visual.spec.ts/*-linux.png >/dev/null 2>&1; then
            echo "generate=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate screenshot baselines
        if: steps.baselines.outputs.generate == 'true'
        run: npx playwright test --project=legacy visual --update-snapshots
      - uses: actions/upload-artifact@v4
        if: steps.baselines.outputs.generate == 'true'
        with:
          name: linux-screenshot-baselines
          path: dashboard/tests/e2e/__screenshots__/
      - name: Baselines must be committed
        if: steps.baselines.outputs.generate == 'true'
        run: |
          echo "::error::Linux screenshot baselines were generated, not compared. Download the linux-screenshot-baselines artifact, commit its *-linux.png files under dashboard/tests/e2e/__screenshots__/, and push."
          exit 1
      - name: Run e2e tests
        if: steps.baselines.outputs.generate == 'false'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
